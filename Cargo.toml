# Рабочее пространство Cargo: приложение и инструменты разработки.
# Общие Cargo.lock и target/ (папка задана в .cargo/config.toml).
# Профили и [patch] действуют только здесь, в корне: в членах они игнорируются.
[workspace]
resolver = "3"
members = ["src-tauri", "tools/gen-vault"]
# Сторонний код (например, своя копия wry в vendor/) — не член рабочего пространства.
exclude = ["vendor"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Своя копия wry той же версии, что в Cargo.lock, с одной правкой:
# IsCustomCrashReportingEnabled = true — дампы падений WebView2 не уходят в
# Microsoft (ADR 0007). Что изменено и как перенести на новую версию —
# vendor/wry/RHIZOMIND-PATCH.md. Тест: src-tauri/tests/security_config.rs.
[patch.crates-io]
wry = { path = "vendor/wry" }
