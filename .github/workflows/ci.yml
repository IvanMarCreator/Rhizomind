# Проверка, сборка и сценарный тест на Windows и Linux.
# Без секретов и сторонних сервисов; права только на чтение кода.
# Все actions закреплены по SHA коммита (ADR 0009); версия — в комментарии.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # Обычно ~25 мин на Windows с кэшем; запас на холодный кэш. Зависание —
    # ошибка, а не часы ожидания.
    timeout-minutes: 45
    steps:
      - name: Получить код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Установить Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # Пакеты apt кэшируются: зеркало Azure временами отдаёт их по десяткам
      # КБ/с, и шаг шёл до 38 минут (задача 0.10, tools/ci-apt/install.sh).
      # Ключ — образ раннера и скрипт со списком пакетов; сохраняется сразу после шага,
      # даже если задание потом упадёт.
      - name: Образ раннера (Linux)
        id: image
        if: runner.os == 'Linux'
        run: echo "version=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"

      - name: Кэш пакетов apt (Linux)
        id: apt-cache
        if: runner.os == 'Linux'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ steps.image.outputs.version }}-${{ hashFiles('tools/ci-apt/install.sh') }}
          restore-keys: apt-${{ steps.image.outputs.version }}-

      - name: Системные библиотеки (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 20
        env:
          APT_CACHE_DIR: ${{ runner.temp }}/apt-archives
        run: tools/ci-apt/install.sh

      - name: Сохранить кэш пакетов apt (Linux)
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.apt-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ steps.image.outputs.version }}-${{ hashFiles('tools/ci-apt/install.sh') }}

      # Версия Rust берётся из rust-toolchain.toml: rustup ставит её при первом вызове cargo.
      - name: Rust из rust-toolchain.toml
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version

      - name: Кэш Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Рабочее пространство Cargo в корне. Выпускная сборка — src-tauri/target
          # (.cargo/config.toml), тестовая (функция webdriver) — src-tauri/target-e2e
          # (CARGO_TARGET_DIR в tools/build-e2e).
          workspaces: |
            . -> src-tauri/target
            . -> src-tauri/target-e2e
          cache-bin: true

      - name: Инструменты проверки (cargo-deny, tauri-driver)
        shell: bash
        run: |
          cargo install --locked cargo-deny@0.20.2
          cargo install --locked tauri-driver@2.1.0

      # Скрипты установки пакетов не запускаются (.npmrc: ignore-scripts=true).
      - name: Зависимости интерфейса
        run: npm ci

      - name: Проверки (типы, линтер, тесты, сеть, лицензии, cargo fmt/clippy/test/deny/tree)
        run: npm run verify

      # Окно выбора папки (задача 0.8, решение владельца 56): настоящее окно ОС
      # на рабочем столе раннера в отдельном процессе, «пользователь» переходит
      # во временную папку и выбирает её; после выхода процесса — поиск её имени
      # во всём HKCU, кроме Software\Classes\Local Settings (не перемещается),
      # и в %APPDATA% (перемещаемый профиль). Контроль: окно с опциями rfd пишет
      # путь в Roaming, и поиск его находит. ComDlg32\LastVisitedPidlMRU здесь
      # Windows не пишет даже для rfd — эта запись тестом не покрыта
      # (docs/SECURITY.md). Идёт и после сбоя verify (интерфейс для сборки ядра
      # уже собран в check:network).
      - name: Окно выбора папки без следов в Roaming (Windows)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        timeout-minutes: 15
        shell: bash
        env:
          RHIZOMIND_T08_CONTROL: "1"
        run: cargo test -p rhizomind --locked --lib dialogs::folder_windows -- --ignored --nocapture --test-threads=1

      # Генератор тестового хранилища (задача 1.6). Проверка состава идёт в verify;
      # здесь — нагрузочный тест в выпускном профиле (10 000 заметок по лучшей из трёх
      # попыток: Linux до 1,5 с, Windows до 12 с; обоснование — tools/gen-vault/tests/perf.rs)
      # и прогон командной строки.
      - name: Генератор тестового хранилища
        shell: bash
        run: |
          cargo test -p gen-vault --release --locked -- --ignored --nocapture
          cargo run -p gen-vault --release --locked -- --notes 10000 --out "$RUNNER_TEMP/vault-10k" --manifest "$RUNNER_TEMP/vault-10k.json"

      # Тест производительности быстрого перехода (задача 1.1): поиск по 10 000
      # именам не дольше 20 мс; в verify не входит — нужен выпускной профиль.
      - name: Производительность поиска ядра
        shell: bash
        run: cargo test -p rhizomind --release --locked --lib -- --ignored --nocapture --skip watcher::load_tests --skip dialogs::folder_windows

      # Слежение за папкой под нагрузкой (задача 1.4, ADR 0006): 10 000 файлов,
      # массовая замена как при git checkout, переименования, переполнение.
      # Тестовая сборка — та же, что в verify (отладочный профиль).
      - name: Слежение за папкой под нагрузкой
        timeout-minutes: 15
        shell: bash
        run: cargo test -p rhizomind --locked --lib watcher::load_tests -- --ignored --nocapture --test-threads=1

      - name: Сборка приложения
        run: npm run build

      # msedgedriver должен совпадать по версии с установленным WebView2 Runtime.
      - name: msedgedriver под версию WebView2 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $version = (Get-ItemProperty -Path $key).pv
          Write-Host "WebView2 Runtime: $version"
          $dir = Join-Path $env:RUNNER_TEMP 'msedgedriver'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $zip = Join-Path $dir 'edgedriver.zip'
          try {
            Invoke-WebRequest -Uri "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $dir -Force
            $driver = Join-Path $dir 'msedgedriver.exe'
          } catch {
            Write-Warning "Не удалось скачать msedgedriver $version ($_); беру предустановленный"
            $driver = Join-Path $env:EDGEWEBDRIVER 'msedgedriver.exe'
          }
          & $driver --version
          # Обёртка пишет подробный журнал msedgedriver (выкладывается артефактом).
          $wrapper = Join-Path $dir 'msedgedriver-logged.cmd'
          "@`"$driver`" %* --verbose --log-path=`"$dir\msedgedriver.log`"" | Set-Content -Encoding ascii $wrapper
          "MSEDGEDRIVER=$wrapper" >> $env:GITHUB_ENV

      # Сценарные тесты WebDriver идут на сборке с функцией `webdriver` (порт отладки
      # для msedgedriver поверх защищённых флагов, src-tauri/src/lib.rs) в отдельной
      # папке src-tauri/target-e2e. Тест следов и флагов (tests/e2e/traces.test.ts)
      # идёт на выпускной сборке из шага «Сборка приложения».
      - name: Сборка для сценарного теста
        run: npm run build:e2e

      # Для замера производительности (задание perf ниже, задача 3.2): тестовая
      # сборка (интерфейс встроен в исполняемый файл), генератор хранилища из
      # шага «Генератор тестового хранилища» и tauri-driver — без второй сборки.
      - name: Файлы для замера производительности
        shell: bash
        run: |
          exe=""; [ "$RUNNER_OS" = Windows ] && exe=.exe
          dir="$RUNNER_TEMP/perf-bin"
          mkdir -p "$dir"
          cp "src-tauri/target-e2e/release/rhizomind$exe" "src-tauri/target/release/gen-vault$exe" "$HOME/.cargo/bin/tauri-driver$exe" "$dir/"
          ls -l "$dir"

      - name: Загрузить файлы для замера производительности
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-bin-${{ runner.os }}
          path: ${{ runner.temp }}/perf-bin/
          retention-days: 1
          if-no-files-found: error

      # Предел 20 мин: после сценариев выпуска (задача 3.1) набор идёт ~9–10 мин
      # и на медленном раннере упирался в прежние 10 мин при всех тестах зелёных.
      - name: Сценарный тест (Linux)
        timeout-minutes: 20
        if: runner.os == 'Linux'
        env:
          # Без GPU в Xvfb WebKitGTK со своим DMA-BUF-отрисовщиком даёт пустой снимок.
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          # Без шины доступности GTK ждёт её по D-Bus (предупреждение AT-SPI) —
          # это замедляет запуск окна под WebDriver.
          NO_AT_BRIDGE: "1"
        run: xvfb-run -a npm run test:e2e

      # Телеметрия компилятора MSVC (vctip.exe) остаётся висеть после сборок
      # Rust и пишет %LOCALAPPDATA%\Microsoft\VSApplicationInsights — тест
      # следов принимал это за запись программы (задача 0.10; раньше — «чужой
      # процесс vctip.exe»). Сборок дальше нет — процесс останавливается.
      - name: Остановить телеметрию MSVC (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vctip = @(Get-Process -Name vctip -ErrorAction SilentlyContinue)
          Write-Host "vctip.exe: $($vctip.Count)"
          $vctip | Stop-Process -Force -ErrorAction SilentlyContinue
          $vctip | Wait-Process -Timeout 30 -ErrorAction SilentlyContinue

      - name: Сценарный тест (Windows)
        timeout-minutes: 20
        if: runner.os == 'Windows'
        env:
          # Тест следов подменяет vaults.json тестовым хранилищем (машина CI одноразовая).
          RHIZOMIND_TRACES_VAULT_SCENARIO: "1"
        run: npm run test:e2e

      # Сбой сценарного теста: хвосты журналов драйверов — прямо в журнал CI
      # (артефакты без входа в GitHub не скачать; задача 0.10).
      - name: Журналы драйверов при сбое
        if: failure()
        shell: bash
        run: |
          # Журнал tauri-driver лежит рядом со снимками (tests/e2e/driver.ts, SCREENSHOT_DIR).
          for log in test-results/e2e/tauri-driver-*.log "$RUNNER_TEMP/msedgedriver/msedgedriver.log"; do
            [ -f "$log" ] || continue
            echo "::group::$log (последние 200 строк)"
            tail -n 200 "$log"
            echo "::endgroup::"
          done

      - name: Снимки экрана сценарных тестов
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-screenshots-${{ runner.os }}
          path: test-results/
          retention-days: 14
          # Шаг идёт и после сбоя раньше теста; отсутствие снимка при успехе ловит сам тест.
          if-no-files-found: warn

      - name: Журнал msedgedriver (Windows)
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msedgedriver-log
          path: ${{ runner.temp }}/msedgedriver/msedgedriver.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Портативная сборка (Windows)
        if: runner.os == 'Windows'
        run: npm run package:portable

      - name: Загрузить портативную сборку (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rhizomind-portable-windows
          path: release/*.zip
          retention-days: 14
          if-no-files-found: error

      # SBOM и список лицензий ядра (аудит 3.3, Р9; приложение к выпуску — задача 3.4):
      # шаг в каждом прогоне, чтобы инструмент не сломался незаметно к выпуску.
      # cargo-cyclonedx — программа машины сборки, не зависимость Rhizomind (в
      # Cargo.lock и в программу не попадает); при установке cargo скачивает её с
      # crates.io — сеть нужна только CI. Сама `npm run sbom` идёт без сети
      # (CARGO_NET_OFFLINE, npm --offline): крейты всех целей уже скачаны в verify.
      - name: SBOM (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo install --locked cargo-cyclonedx@0.5.9
          npm run sbom
          ls -l release/sbom-rust.cdx.json release/sbom-npm.cdx.json release/licenses-rust.json

      - name: Загрузить SBOM (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rhizomind-sbom
          path: |
            release/sbom-rust.cdx.json
            release/sbom-npm.cdx.json
            release/licenses-rust.json
          retention-days: 14
          if-no-files-found: error

  # Помощник ручного сетевого аудита (задача 3.3б, решение владельца 102):
  # синтаксис Windows PowerShell 5.1 (powershell.exe), PSScriptAnalyzer
  # (правила уровня Error), разбор журнала Process Monitor на образце
  # tests/audit/fixtures/procmon-sample.csv. Сборка не нужна — отдельное
  # быстрое задание, основной verify от него не зависит.
  audit-script:
    name: Скрипт сетевого аудита (синтаксис и разбор образца)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Получить код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Синтаксис PowerShell 5.1 и PSScriptAnalyzer
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/audit/check-syntax.ps1
          exit $LASTEXITCODE

      - name: Разбор журнала Process Monitor на образце
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/audit/parse.tests.ps1
          exit $LASTEXITCODE

  # Неинтерактивный прогон помощника аудита (-Unattended -NoProcmon, простой
  # 30 с, без сценариев) на портативной выпускной сборке из этого же прогона
  # CI: скрипт доходит до results.md, флаги движка на месте. Журнал DNS не
  # включается. Отдельное задание после verify — его сбой verify не валит.
  audit-script-run:
    name: Скрипт сетевого аудита (прогон на выпускной сборке)
    needs: verify
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Получить код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Портативная сборка из verify
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rhizomind-portable-windows
          path: ${{ runner.temp }}/portable

      - name: Неинтерактивный прогон скрипта аудита
        shell: powershell
        run: |
          $zip = Get-ChildItem -LiteralPath "$env:RUNNER_TEMP\portable" -Filter '*.zip' -Recurse | Select-Object -First 1
          Write-Host "Portable build: $($zip.Name)"
          $app = Join-Path $env:RUNNER_TEMP 'portable-app'
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $app -Force
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/audit/run-unattended.ps1 -AppExe (Join-Path $app 'rhizomind.exe') -IdleSeconds 30
          exit $LASTEXITCODE

  # Производительность (задача 3.2, критерий С9.5): хранилище из 10 000 заметок —
  # дерево не позже 3 с после открытия, быстрый переход до 100 мс, ввод в
  # заметке на 5 000 строк без заметных задержек (tests/perf/perf.test.ts).
  # Отдельное задание: превышение предела валит его, а не verify; сборка — из
  # verify (артефакт perf-bin-*). Вывод по медиане повторов — разброс общих
  # раннеров (tests/perf/stats.ts, docs/reviews/2026-11-01-task-3.2-perf.md).
  perf:
    name: perf (${{ matrix.os }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Получить код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Установить Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # Пакеты apt — из кэша, который сохраняет verify (tools/ci-apt/install.sh).
      - name: Образ раннера (Linux)
        id: image
        if: runner.os == 'Linux'
        run: echo "version=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"

      - name: Кэш пакетов apt (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ steps.image.outputs.version }}-${{ hashFiles('tools/ci-apt/install.sh') }}
          restore-keys: apt-${{ steps.image.outputs.version }}-

      - name: Системные библиотеки (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 20
        env:
          APT_CACHE_DIR: ${{ runner.temp }}/apt-archives
        run: tools/ci-apt/install.sh

      - name: Зависимости интерфейса
        run: npm ci

      - name: Получить файлы для замера
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: perf-bin-${{ runner.os }}
          path: ${{ runner.temp }}/perf-bin

      # Программа — туда, где её ищет tests/e2e/driver.ts (тестовая сборка);
      # артефакт не хранит права на запуск.
      - name: Разложить файлы для замера
        shell: bash
        run: |
          exe=""; [ "$RUNNER_OS" = Windows ] && exe=.exe
          bin="$RUNNER_TEMP/perf-bin"
          chmod +x "$bin"/*
          mkdir -p src-tauri/target-e2e/release
          cp "$bin/rhizomind$exe" src-tauri/target-e2e/release/
          echo "TAURI_DRIVER=$bin/tauri-driver$exe" >> "$GITHUB_ENV"
          echo "RHIZOMIND_PERF_GEN_VAULT=$bin/gen-vault$exe" >> "$GITHUB_ENV"

      # msedgedriver — под установленный WebView2 Runtime, как в verify.
      - name: msedgedriver под версию WebView2 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $version = (Get-ItemProperty -Path $key).pv
          Write-Host "WebView2 Runtime: $version"
          $dir = Join-Path $env:RUNNER_TEMP 'msedgedriver'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $zip = Join-Path $dir 'edgedriver.zip'
          try {
            Invoke-WebRequest -Uri "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $dir -Force
            $driver = Join-Path $dir 'msedgedriver.exe'
          } catch {
            Write-Warning "Не удалось скачать msedgedriver $version ($_); беру предустановленный"
            $driver = Join-Path $env:EDGEWEBDRIVER 'msedgedriver.exe'
          }
          & $driver --version
          "MSEDGEDRIVER=$driver" >> $env:GITHUB_ENV

      - name: Замер производительности (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 20
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          NO_AT_BRIDGE: "1"
        run: xvfb-run -a npm run test:perf

      - name: Замер производительности (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 20
        run: npm run test:perf

      - name: Отчёт о производительности
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-report-${{ runner.os }}
          path: test-results/
          retention-days: 14
          if-no-files-found: warn
