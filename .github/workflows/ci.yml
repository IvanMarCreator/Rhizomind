# Временная ветка опыта 0.8: только окно выбора папки, два способа задать папку.
name: CI
on:
  push:
    branches: ["task/0.8-probe"]
permissions:
  contents: read
jobs:
  probe:
    name: probe (${{ matrix.preset }})
    strategy:
      fail-fast: false
      matrix:
        preset: [navigate, full-path, default-folder]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> src-tauri/target
      - run: npm ci
      - run: npm run build:ui
      - name: dialog
        shell: bash
        env:
          RHIZOMIND_T08_CONTROL: "1"
          RHIZOMIND_T08_PRESET: ${{ matrix.preset }}
        run: cargo test -p rhizomind --locked --lib dialogs::folder_windows -- --include-ignored --nocapture --test-threads=1
