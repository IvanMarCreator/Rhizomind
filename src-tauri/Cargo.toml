[package]
name = "rhizomind"
version = "0.1.0"
description = "Local-only knowledge base with linked Markdown notes. No sync, no cloud, no telemetry."
authors = ["Rhizomind contributors"]
license = "GPL-3.0-only"
repository = "https://github.com/IvanMarCreator/Rhizomind"
edition = "2024"
rust-version = "1.99"
publish = false

[lib]
# Библиотека — чтобы ядро проверялось тестами без запуска окна.
name = "rhizomind_lib"
path = "src/lib.rs"

[[bin]]
name = "rhizomind"
path = "src/main.rs"

[[test]]
# Настоящее окно WebView2 на Windows: нужен главный поток, поэтому свой main.
name = "webview2_runtime"
harness = false

[features]
# Только для сборки сценарных тестов (npm run build:e2e): передаёт WebView2
# флаги msedgedriver (порт отладки). Выпускные сборки (build, package:*) — без неё.
webdriver = []

[build-dependencies]
tauri-build = { version = "=2.7.4", features = ["isolation"] }

[dependencies]
# Функции по умолчанию: wry, compression, common-controls-v6, dynamic-acl, x11, dbus.
# isolation — вызовы ядра через изолированный iframe с шифрованием (ADR 0009,
# `app.security.pattern` в tauri.conf.json, код фильтра — src-isolation/).
# Запрещены (src-tauri/deny.toml): devtools, native-tls*, rustls-tls, protocol-asset.
tauri = { version = "=2.12.5", features = ["isolation"] }
# Системные диалоги ядра (выбор папки хранилища, подтверждение внешней ссылки
# и безвозвратного удаления) — только из Rust; интерфейсу права dialog:* не
# выдаются (ADR 0009).
tauri-plugin-dialog = "=2.8.3"
# Типы команд ядра и их JSON (контракт API v1).
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
# Разбор и нормализация адреса внешней ссылки (punycode, процентное
# кодирование); уже был в дереве через tauri. Без функций serde/std-сети.
url = "=2.5.8"
# Хранилище (vault, задача 1.2): версия файла — хэш содержимого; он же — в
# журнале своих записей наблюдателя (watcher, задача 1.4).
# Без функций по умолчанию лишнего нет: std, без rayon и mmap.
blake3 = "=1.8.7"
# Атомарная запись: временный файл в .rhizomind/tmp/ (раньше — только в тестах).
tempfile = "=3.27.0"
# Канонизация корня хранилища без префикса \\?\ на Windows.
dunce = "=1.0.5"
# Удаление в корзину ОС. Без chrono (нужен только для списка корзины);
# COM на Windows — однопоточная модель в отдельном потоке удаления.
trash = { version = "=5.2.9", default-features = false, features = ["coinit_apartmentthreaded"] }
# Ключ имени (модуль names): NFC → полное приведение регистра → NFC.
unicode-normalization = "=0.1.26"
icu_casemap = "=2.4.0"
# Нечёткий поиск быстрого перехода (модуль switcher). Без `unicode-segmentation`
# (лишний крейт): строки уже приведены ключом имени; `unicode-casefold` и
# `unicode-normalization` — встроенные таблицы без зависимостей, без них крейт
# не собирается.
nucleo-matcher = { version = "=0.3.1", default-features = false, features = ["unicode-casefold", "unicode-normalization"] }
# Слежение за папкой хранилища (ADR 0006, задача 1.4). Кандидаты в выпуск —
# версии точные, обновление только с прогоном нагрузочных тестов.
notify = "=9.0.0-rc.6"
notify-debouncer-full = "=0.8.0-rc.2"
# Идентификатор файла (FileId NTFS, inode) — распознавание переименований.
file-id = "=0.2.3"

[target.'cfg(windows)'.dependencies]
# Те же версии, что уже приходят через wry: новых крейтов нет.
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_ErrorReporting",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }
# ReplaceFileW (замена с сохранением даты создания) и GetFinalPathNameByHandleW
# (итоговый путь открытого файла) — хранилище, задача 1.2.
# Местное время для имени копии при конфликте — FileTimeToSystemTime и
# SystemTimeToTzSpecificLocalTime (Win32_System_Time).
# Передача подтверждённого адреса ОС: свой вызов ShellExecuteExW с классом
# протокола (external_links/os.rs, задача 1.5) — Win32_System_Com,
# Win32_System_Registry, Win32_UI_Shell.
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_System_Time",
  "Win32_UI_Shell",
] }

[target.'cfg(unix)'.dependencies]
# Местное время для имени копии при конфликте (localtime_r); уже было в
# дереве через tauri и tempfile.
libc = "=0.2.191"

# Передача подтверждённого адреса ОС на macOS и Linux (ADR 0009). Без функций
# `insecure` (запуск через оболочку) и `shellexecute-on-windows`.
[target.'cfg(not(windows))'.dependencies]
open = "=5.4.5"

[dev-dependencies]
# Свойства ключа имени, кратчайшего пути и разбора ссылок (модули names, links).
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
# Функция `test` — подменный runtime Tauri для тестов без настоящего окна;
# в выпускную сборку не попадает (только dev-зависимость).
tauri = { version = "=2.12.5", features = ["isolation", "test"] }
# Снимки контракта команд: contracts/v1/*.snap (их же читает Vitest).
insta = { version = "=1.49.0", features = ["json"] }
# Генератор тестового хранилища: образцы кодировок в тестах vault, ожидаемые
# разрешения ссылок и кратчайшие пути в тестах links, нагрузочные тесты
# наблюдателя.
gen-vault = { version = "=0.1.0", path = "../tools/gen-vault" }

[target.'cfg(windows)'.dev-dependencies]
# Точки соединения NTFS в тестах контура хранилища.
junction = "=2.1.0"

# Профиль выпуска и [patch.crates-io] (своя копия wry) — в корневом Cargo.toml
# (рабочее пространство): в члене Cargo их молча игнорирует.
