[package]
name = "rhizomind"
version = "0.1.0"
description = "Local-only knowledge base with linked Markdown notes. No sync, no cloud, no telemetry."
authors = ["Rhizomind contributors"]
license = "GPL-3.0-only"
repository = "https://github.com/IvanMarCreator/Rhizomind"
edition = "2024"
rust-version = "1.99"
publish = false

[lib]
# Библиотека — чтобы ядро проверялось тестами без запуска окна.
name = "rhizomind_lib"
path = "src/lib.rs"

[[bin]]
name = "rhizomind"
path = "src/main.rs"

[[test]]
# Настоящее окно WebView2 на Windows: нужен главный поток, поэтому свой main.
name = "webview2_runtime"
harness = false

[features]
# Только для сборки сценарных тестов (npm run build:e2e): передаёт WebView2
# флаги msedgedriver (порт отладки). Выпускные сборки (build, package:*) — без неё.
webdriver = []

[build-dependencies]
tauri-build = { version = "=2.7.4", features = ["isolation"] }

[dependencies]
# Функции по умолчанию: wry, compression, common-controls-v6, dynamic-acl, x11, dbus.
# isolation — вызовы ядра через изолированный iframe с шифрованием (ADR 0009,
# `app.security.pattern` в tauri.conf.json, код фильтра — src-isolation/).
# Запрещены (src-tauri/deny.toml): devtools, native-tls*, rustls-tls, protocol-asset.
tauri = { version = "=2.12.5", features = ["isolation"] }
# Системные диалоги ядра (выбор папки хранилища, подтверждение внешней ссылки
# и безвозвратного удаления) — только из Rust; интерфейсу права dialog:* не
# выдаются (ADR 0009).
tauri-plugin-dialog = "=2.8.3"
# Типы команд ядра и их JSON (контракт API v1).
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
# Ключ имени (модуль names): NFC → полное приведение регистра → NFC.
unicode-normalization = "=0.1.26"
icu_casemap = "=2.4.0"
# Нечёткий поиск быстрого перехода (модуль switcher). Без `unicode-segmentation`
# (лишний крейт): строки уже приведены ключом имени; `unicode-casefold` и
# `unicode-normalization` — встроенные таблицы без зависимостей, без них крейт
# не собирается.
nucleo-matcher = { version = "=0.3.1", default-features = false, features = ["unicode-casefold", "unicode-normalization"] }

[target.'cfg(windows)'.dependencies]
# Те же версии, что уже приходят через wry: новых крейтов нет.
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_ErrorReporting",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# Свойства ключа имени, кратчайшего пути и разбора ссылок (модули names, links).
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
# Функция `test` — подменный runtime Tauri для тестов без настоящего окна;
# в выпускную сборку не попадает (только dev-зависимость).
tauri = { version = "=2.12.5", features = ["isolation", "test"] }
# Снимки контракта команд: contracts/v1/*.snap (их же читает Vitest).
insta = { version = "=1.49.0", features = ["json"] }
# Временная папка для заглушки хранилища в тестах прав.
tempfile = "=3.27.0"
# Генератор тестового хранилища (задача 1.6): ожидаемые разрешения ссылок и
# кратчайшие пути из манифеста проверяют модуль links.
gen-vault = { path = "../tools/gen-vault" }

# Профиль выпуска и [patch.crates-io] (своя копия wry) — в корневом Cargo.toml
# (рабочее пространство): в члене Cargo их молча игнорирует.
